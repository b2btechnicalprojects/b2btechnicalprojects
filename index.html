<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2B Technical Projects — LafargeHolcim Bangladesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #111317;
    --ink-2: #181B20;
    --ink-card: #1E2229;
    --ink-card-hover: #262B34;
    --stone: #E9E3D2;
    --stone-2: #F3EFE4;
    --brass: #B08D57;
    --brass-light: #D9C39A;
    --brass-dark: #8C6F42;
    --text-light: #FFFFFF;
    --text-muted: #9E988D;
    --line: rgba(255, 255, 255, 0.1);
    --line-gold: rgba(176, 141, 87, 0.35);

    --cat-onboarded: #B08D57;
    --cat-working: #3E6B63;
    --cat-pipeline: #5B7A99;
    --cat-previously: #8B8578;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: var(--stone-2);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  h1, h2, h3, h4, .serif {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  button, input, select, textarea { font-family: 'Poppins', sans-serif; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass-light); color: var(--ink); }

  /* ================= NAVIGATION ================= */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 5vw;
    background: linear-gradient(180deg, rgba(17,19,23,0.96) 0%, rgba(17,19,23,0.7) 75%, transparent 100%);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: background 0.35s, padding 0.35s, box-shadow 0.35s;
    color: #fff;
  }
  .nav.scrolled {
    background: rgba(17, 19, 23, 0.98);
    padding: 13px 5vw;
    box-shadow: 0 4px 24px rgba(0,0,0,0.55);
    border-bottom: 1px solid var(--line);
  }
  .nav-logo {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.02em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  .nav-logo span { color: var(--brass-light); font-weight: 500; font-style: italic; }
  .nav-right { display: flex; align-items: center; gap: 20px; }
  .nav-links { display: flex; align-items: center; gap: 20px; position: relative; }
  
  .nav-link {
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: rgba(255,255,255,0.85);
    background: none;
    border: none;
    padding: 8px 6px;
    transition: color 0.2s, transform 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .nav-link:hover, .nav-link.active {
    color: var(--brass-light);
  }

  /* DROPDOWN FOR "PROJECT" */
  .nav-item-dropdown {
    position: relative;
    display: inline-block;
  }
  .nav-caret {
    display: inline-flex;
    align-items: center;
    transition: transform 0.25s ease;
  }
  .nav-item-dropdown.open .nav-caret,
  .nav-item-dropdown:hover .nav-caret {
    transform: rotate(180deg);
  }

  .dropdown-menu {
    position: absolute;
    top: calc(100% + 14px);
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    min-width: 295px;
    background: rgba(24, 27, 32, 0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line-gold);
    border-radius: 8px;
    padding: 10px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.65), 0 0 24px rgba(176,141,87,0.12);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.25s;
    z-index: 1000;
  }
  .dropdown-menu::before {
    content: '';
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 10px;
    height: 10px;
    background: rgba(24, 27, 32, 0.98);
    border-top: 1px solid var(--line-gold);
    border-left: 1px solid var(--line-gold);
  }
  .dropdown-menu.show,
  .nav-item-dropdown:hover .dropdown-menu {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }

  .dropdown-header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--brass-light);
    font-weight: 600;
    padding: 6px 12px 8px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .dropdown-item {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
    transition: all 0.18s ease;
    gap: 10px;
  }
  .dropdown-item:hover {
    background: rgba(176, 141, 87, 0.14);
    color: #fff;
    transform: translateX(4px);
  }
  .dropdown-item.active {
    background: rgba(176, 141, 87, 0.22);
    color: var(--brass-light);
    font-weight: 600;
  }
  .dropdown-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dropdown-title {
    flex-grow: 1;
  }
  .dropdown-badge {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    color: var(--text-muted);
    border: 1px solid var(--line);
  }
  .dropdown-item:hover .dropdown-badge,
  .dropdown-item.active .dropdown-badge {
    background: var(--brass);
    color: var(--ink);
    border-color: var(--brass);
    font-weight: 600;
  }
  .dropdown-divider {
    height: 1px;
    background: var(--line);
    margin: 6px 4px;
  }

  /* SYNC BADGE & SEARCH */
  .nav-sync-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(176, 141, 87, 0.12);
    border: 1px solid var(--line-gold);
    color: var(--brass-light);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .nav-sync-badge:hover { background: rgba(176, 141, 87, 0.22); }
  .sync-pulse {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #10B981;
    box-shadow: 0 0 8px #10B981;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.7; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } }
  .nav-search-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--line);
    color: #fff;
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-search-btn:hover { background: var(--brass); color: var(--ink); border-color: var(--brass); }

  /* MOBILE TOGGLE & DRAWER */
  .nav-mobile-toggle {
    display: none;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--line);
    color: #fff;
    width: 38px; height: 38px;
    border-radius: 50%;
    align-items: center; justify-content: center;
    cursor: pointer;
  }
  .mobile-drawer {
    display: none;
    position: fixed;
    top: 68px;
    left: 0;
    right: 0;
    background: rgba(17, 19, 23, 0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line-gold);
    padding: 20px 5vw;
    z-index: 99;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 16px 32px rgba(0,0,0,0.7);
    max-height: calc(100vh - 70px);
    overflow-y: auto;
  }
  .mobile-drawer.open {
    display: flex;
  }
  .mobile-nav-btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    text-align: left;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .mobile-sub-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 4px 0 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .mobile-sub-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.85);
    font-size: 13.5px;
    text-align: left;
    padding: 8px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mobile-sub-btn:hover, .mobile-sub-btn.active {
    color: var(--brass-light);
  }

  @media (max-width: 860px) {
    .nav-links { display: none; }
    .nav-mobile-toggle { display: flex; }
    .nav { padding: 14px 20px; }
  }

  /* ================= HERO (MOVING PICTURES SLIDER WITH KEN BURNS) ================= */
  .hero {
    position: relative;
    height: 100vh;
    min-height: 620px;
    overflow: hidden;
    background: var(--ink);
  }
  .hero-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .hero-slide.active {
    opacity: 1;
    pointer-events: auto;
  }
  .hero-slide-bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .hero-slide-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: center center;
    will-change: transform;
    transform: scale(1.02);
  }
  .hero-slide.active:nth-child(odd) .hero-slide-bg img {
    animation: kenBurns1 8.5s ease-out forwards;
  }
  .hero-slide.active:nth-child(even) .hero-slide-bg img {
    animation: kenBurns2 8.5s ease-out forwards;
  }
  @keyframes kenBurns1 {
    0% { transform: scale(1.02) translate3d(0, 0, 0); }
    100% { transform: scale(1.12) translate3d(-1%, -0.6%, 0); }
  }
  @keyframes kenBurns2 {
    0% { transform: scale(1.02) translate3d(0, 0, 0); }
    100% { transform: scale(1.12) translate3d(1%, -0.6%, 0); }
  }
  .hero-slide-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 70% 30%, rgba(17,19,23,0.1) 0%, rgba(17,19,23,0.65) 65%, rgba(17,19,23,0.95) 100%),
                linear-gradient(180deg, rgba(17,19,23,0.3) 0%, rgba(17,19,23,0.15) 45%, rgba(17,19,23,0.92) 100%);
  }

  .hero-content {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0 5vw 90px;
    color: #fff;
    max-width: 880px;
    z-index: 10;
  }
  .hero-eyebrow {
    font-size: 13px;
    letter-spacing: 0.6px;
    color: var(--brass-light);
    margin-bottom: 14px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .hero-title {
    font-size: clamp(34px, 5.4vw, 62px);
    font-weight: 700;
    line-height: 1.08;
    margin: 0 0 16px;
    color: #fff;
    letter-spacing: -0.025em;
  }
  .hero-title em {
    font-style: italic;
    color: var(--brass-light);
    font-weight: 400;
  }
  .hero-sub {
    font-size: 16px;
    line-height: 1.65;
    color: rgba(255,255,255,0.85);
    max-width: 580px;
    margin-bottom: 24px;
  }
  .hero-meta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    color: rgba(255,255,255,0.85);
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .hero-actions {
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn-primary {
    background: var(--brass);
    color: #111317;
    border: none;
    padding: 13px 26px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .btn-primary:hover {
    background: var(--brass-light);
    transform: translateY(-2px);
  }
  .btn-outline {
    background: rgba(255,255,255,0.06);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 12px 24px;
    border-radius: 4px;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.2s;
  }
  .btn-outline:hover {
    border-color: var(--brass-light);
    color: var(--brass-light);
    background: rgba(176, 141, 87, 0.12);
    transform: translateY(-2px);
  }

  /* Floating Spec Card */
  .hero-floating-card {
    position: absolute;
    right: 5vw;
    bottom: 90px;
    z-index: 10;
    width: 320px;
    background: rgba(24, 27, 32, 0.85);
    border: 1px solid var(--line-gold);
    backdrop-filter: blur(16px);
    border-radius: 8px;
    padding: 22px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    animation: floatCard 6s ease-in-out infinite;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  @keyframes floatCard {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
  .hero-floating-card .tag {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 4px 10px;
    border-radius: 20px;
    width: fit-content;
    color: #fff;
  }
  .hero-floating-card .name {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    margin: 0;
    line-height: 1.25;
  }
  .hero-floating-card .status {
    font-size: 12.5px;
    color: var(--stone-2);
    line-height: 1.55;
    opacity: 0.9;
  }
  .hero-floating-card .btn-peek {
    color: var(--brass-light);
    font-size: 13px;
    font-weight: 600;
    background: none;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .hero-floating-card .btn-peek:hover { color: #fff; }

  @media (max-width: 980px) {
    .hero-floating-card { display: none; }
  }

  /* Slider arrows & cues */
  .hero-nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 15;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(6px);
  }
  .hero-nav-arrow:hover {
    background: var(--brass);
    color: var(--ink);
    border-color: var(--brass);
  }
  .hero-nav-arrow.prev { left: 24px; }
  .hero-nav-arrow.next { right: 24px; }
  @media (max-width: 640px) { .hero-nav-arrow { display: none; } }

  .hero-dots {
    position: absolute;
    right: 5vw;
    top: 50%;
    transform: translateY(-50%);
    z-index: 15;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .hero-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    cursor: pointer;
    transition: all 0.25s;
  }
  .hero-dot.active {
    background: var(--brass-light);
    transform: scale(1.4);
    box-shadow: 0 0 10px var(--brass-light);
  }

  .hero-scroll-cue {
    position: absolute;
    left: 5vw;
    bottom: 26px;
    z-index: 15;
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    cursor: pointer;
  }
  .scroll-line {
    width: 1px; height: 32px;
    background: rgba(255,255,255,0.3);
    position: relative;
    overflow: hidden;
  }
  .scroll-line::after {
    content: '';
    position: absolute;
    top: -100%; left: 0; width: 100%; height: 100%;
    background: var(--brass-light);
    animation: scrolldrop 2s ease-in-out infinite;
  }
  @keyframes scrolldrop { 0% { top:-100%; } 60% { top:100%; } 100% { top:100%; } }

  /* ================= POTENTIAL PROJECTS SLIDING CAROUSEL ================= */
  .spotlight-section {
    padding: 70px 5vw 40px;
    background: var(--ink-2);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .spotlight-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .spotlight-title-group h2 {
    font-size: clamp(24px, 3.2vw, 34px);
    font-weight: 600;
    margin: 0 0 6px;
    color: #fff;
    letter-spacing: -0.02em;
  }
  .spotlight-title-group p {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0;
  }
  .carousel-nav-btns {
    display: flex;
    gap: 10px;
  }
  .c-nav-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .c-nav-btn:hover { background: var(--brass); color: var(--ink); border-color: var(--brass); }

  .carousel-container {
    overflow-x: auto;
    scroll-behavior: smooth;
    padding-bottom: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .carousel-container::-webkit-scrollbar { height: 6px; }
  .carousel-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  .carousel-track {
    display: flex;
    gap: 24px;
    width: max-content;
  }
  .spotlight-card {
    width: 340px;
    background: var(--ink-card);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    display: flex;
    flex-direction: column;
  }
  .spotlight-card:hover {
    transform: translateY(-6px);
    border-color: var(--brass-light);
    box-shadow: 0 16px 32px rgba(0,0,0,0.4);
  }
  .spotlight-card-img {
    height: 190px;
    position: relative;
    overflow: hidden;
    background: #000;
  }
  .spotlight-card-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }
  .spotlight-card:hover .spotlight-card-img img {
    transform: scale(1.08);
  }
  .spotlight-tag {
    position: absolute;
    top: 12px; left: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
    padding: 4px 10px;
    border-radius: 20px;
    color: #fff;
    backdrop-filter: blur(6px);
  }
  .spotlight-card-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }
  .spotlight-name {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    margin: 0 0 6px;
    line-height: 1.3;
  }
  .spotlight-loc {
    font-size: 12.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
  }
  .spotlight-status {
    font-size: 12.5px;
    color: var(--stone-2);
    opacity: 0.9;
    line-height: 1.55;
    margin-bottom: 16px;
  }
  .spotlight-card-actions {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    font-weight: 600;
  }
  .spotlight-btn-view {
    color: var(--brass-light);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ================= MISSION QUOTE ================= */
  .mission {
    padding: 80px 5vw;
    text-align: center;
    background: var(--ink);
    border-bottom: 1px solid var(--line);
  }
  .mission p {
    font-style: italic;
    font-weight: 400;
    font-size: clamp(20px, 2.5vw, 28px);
    line-height: 1.6;
    max-width: 780px;

function escapeHtml(str){
  return (str === undefined || str === null ? '' : str).toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatProjectText(text){
  if(!text || text === 'N/A' || text === '—') return '—';
  return escapeHtml(text).replace(/\r?\n/g, '<br/>');
}

function resolvePhotoUrl(p) {
  let url = (p.photo || '').trim();
  
  // Extract direct image url if BBCode or HTML embed was pasted
  if (url) {
    const bbMatch = url.match(/\[img\](.*?)\[\/img\]/i);
    if (bbMatch && bbMatch[1]) url = bbMatch[1].trim();
    const htmlMatch = url.match(/src=["'](.*?)["']/i);
    if (htmlMatch && htmlMatch[1]) url = htmlMatch[1].trim();
  }

  if (url) {
    const driveMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) ||
                       url.match(/[?&]id=([a-zA-Z0-9_-]+)/) ||
                       url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (driveMatch && driveMatch[1]) {
      return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
    }
    return url;
  }

  // Smart fallback matching by project name if photo column is empty
  const name = (p.name || '').toLowerCase();
  if (name.includes('lged')) return 'https://i.ibb.co.com/wNqh5V43/LGED-Bridge-Project-at-NSEZ.png';
  if (name.includes('jolshiri')) return 'https://i.ibb.co.com/ghw3hGX/Jolshiri-Central-Complex.png';
  if (name.includes('islamic arabic')) return 'https://i.ibb.co.com/Vb3kwjn/Islamic-Arabic-University-Campus.png';
  if (name.includes('ta tower')) return 'https://i.ibb.co/MDbWZpK3/TA-Tower.png';
  if (name.includes('nh tower')) return 'https://i.ibb.co/CKw1z3st/NH-Tower.png';
  if (name.includes('emnipur')) return 'https://i.ibb.co.com/kV8vjtJd/Emnipur-Tower.png';
  if (name.includes('sky reach')) return 'https://i.ibb.co.com/zWYNXt5m/Sky-Reach-Tower.png';
  if (name.includes('green mohakhali')) return 'https://i.ibb.co.com/fdgfsCDn/Green-Mohakhali.png';

  return 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80';
}

/* ------------------------------------------------------------
   CSV PARSER & DATA LOADER (SYNCS LIVE GOOGLE SHEET)
   ------------------------------------------------------------ */
function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\r'){ }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ''));
}

function normalizeHeader(h){
  return h.toString().trim().toLowerCase().replace(/\s+/g, ' ');
}

function rowsToProjects(rows){
  if(!rows.length) return [];
  const keys = rows[0].map(normalizeHeader).map(h => HEADER_MAP[h] || null);
  return rows.slice(1).map(r => {
    const o = {};
    keys.forEach((k, i) => { if(k) o[k] = (r[i] || '').trim(); });
    
    // Normalize category
    const rawCat = o.category || '';
    if(rawCat.match(/onboard/i)) o.category = 'Onboarded';
    else if(rawCat.match(/work|ongoing/i)) o.category = 'Working On';
    else if(rawCat.match(/pipe|upcoming/i)) o.category = 'Pipeline';
    else if(rawCat.match(/prev/i)) o.category = 'Previously Worked';
    else o.category = 'Pipeline';

    return o;
  }).filter(p => p.name);
}

async function loadData(){
  let text = '';
  try{
    const res = await fetch(SHEET_CSV_URL + '&_cb=' + Date.now(), { cache: 'no-store' });
    if(res.ok) text = await res.text();
  }catch(e){
    // If direct fetch fails (e.g. running from file:/// or CORS restricted), try proxy
    try {
      const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(SHEET_CSV_URL + '&_cb=' + Date.now());
      const pRes = await fetch(proxyUrl);
      if(pRes.ok) text = await pRes.text();
    } catch(err){}
  }
  if(text){
    const parsed = rowsToProjects(parseCSV(text));
    if(parsed.length > 0){
      projects = parsed;
    }
  }
  loaded = true;
  render();
}

/* ------------------------------------------------------------
   NAVIGATION ACTIONS
   ------------------------------------------------------------ */
function goToHome(){
  closeProjectDropdown();
  closeMobileMenu();
  view.tab = 'All';
  if(currentView !== 'main'){
    currentView = 'main';
    render();
  } else {
    const tabs = document.getElementById('tabs');
    if(tabs) tabs.outerHTML = renderTabs();
    const grid = document.getElementById('project-grid');
    if(grid) grid.innerHTML = renderGrid();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  updateNavActiveClasses('Home');
}

function toggleProjectDropdown(e){
  if(e) e.stopPropagation();
  const dropdown = document.getElementById('projectDropdownMenu');
  const parent = document.getElementById('projectNavDropdown');
  if(dropdown && parent){
    const isOpen = dropdown.classList.contains('show');
    if(isOpen){
      closeProjectDropdown();
    } else {
      dropdown.classList.add('show');
      parent.classList.add('open');
    }
  }
}

function closeProjectDropdown(){
  const dropdown = document.getElementById('projectDropdownMenu');
  const parent = document.getElementById('projectNavDropdown');
  if(dropdown) dropdown.classList.remove('show');
  if(parent) parent.classList.remove('open');
}

function toggleMobileMenu(){
  mobileMenuOpen = !mobileMenuOpen;
  const drawer = document.getElementById('mobileDrawer');
  if(drawer) drawer.classList.toggle('open', mobileMenuOpen);
}

function closeMobileMenu(){
  mobileMenuOpen = false;
  const drawer = document.getElementById('mobileDrawer');
  if(drawer) drawer.classList.remove('open');
}

function selectCategoryFromNav(cat){
  closeProjectDropdown();
  closeMobileMenu();
  if(currentView !== 'main'){
    currentView = 'main';
    render();
  }
  setTab(cat);
  const sec = document.getElementById('projects');
  if(sec){
    sec.scrollIntoView({ behavior: 'smooth' });
  }
  updateNavActiveClasses('Project');
}

function updateNavActiveClasses(activeItem){
  const homeBtn = document.getElementById('navLinkHome');
  const projBtn = document.getElementById('projectDropdownBtn');
  if(homeBtn && projBtn){
    if(activeItem === 'Home'){
      homeBtn.classList.add('active');
      projBtn.classList.remove('active');
    } else {
      homeBtn.classList.remove('active');
      projBtn.classList.add('active');
    }
  }
}

// Close dropdown on outside click
document.addEventListener('click', (e) => {
  const dropdown = document.getElementById('projectDropdownMenu');
  const dropdownBtn = document.getElementById('projectDropdownBtn');
  if(dropdown && dropdown.classList.contains('show')){
    if(!dropdown.contains(e.target) && !dropdownBtn.contains(e.target)){
      closeProjectDropdown();
    }
  }
});

/* ------------------------------------------------------------
   FILTER & SEARCH CONTROLS
   ------------------------------------------------------------ */
function setTab(cat){
  view.tab = cat;
  const tabs = document.getElementById('tabs');
  if(tabs) tabs.outerHTML = renderTabs();
  const grid = document.getElementById('project-grid');
  if(grid) grid.innerHTML = renderGrid();
}

function onSearchInput(v){
  view.search = v;
  const grid = document.getElementById('project-grid');
  if(grid) grid.innerHTML = renderGrid();
}

function focusSearch(){
  if(currentView !== 'main'){
    currentView = 'main';
    render();
  }
  const sec = document.getElementById('projects');
  if(sec) sec.scrollIntoView({ behavior: 'smooth' });
  setTimeout(() => {
    const input = document.getElementById('search-input');
    if(input) input.focus();
  }, 400);
}

/* ------------------------------------------------------------
   HERO SLIDER CONTROLS
   ------------------------------------------------------------ */
function heroGo(i){
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.hero-dot');
  if(!slides.length) return;

  const featured = getHeroProjects();
  heroIndex = (i + slides.length) % slides.length;
  slides.forEach((s, idx) => s.classList.toggle('active', idx === heroIndex));
  dots.forEach((d, idx) => d.classList.toggle('active', idx === heroIndex));

  const p = featured[heroIndex] || featured[0];
  if(p){
    const realIdx = projects.indexOf(p);
    const locEl = document.getElementById('heroLoc');
    if(locEl) locEl.textContent = p.location || '';
    const nameEl = document.getElementById('heroName');
    if(nameEl) nameEl.textContent = p.name || '';

    // Update buttons
    const dossierBtn = document.getElementById('heroDossierBtn');
    if(dossierBtn) dossierBtn.setAttribute('onclick', `openProjectDashboard(${realIdx})`);
    const floatBtn = document.getElementById('heroFloatBtn');
    if(floatBtn) floatBtn.setAttribute('onclick', `openProjectDashboard(${realIdx})`);

    // Update floating card
    const floatTag = document.getElementById('floatTag');
    if(floatTag) {
      floatTag.textContent = p.category;
      floatTag.style.background = CATEGORY_COLOR[p.category] || '#8B8578';
    }
    const floatName = document.getElementById('floatName');
    if(floatName) floatName.textContent = p.name;
    const floatStatus = document.getElementById('floatStatus');
    if(floatStatus) floatStatus.textContent = p.status || 'Active engagement with project team.';
  }
  resetHeroTimer();
}

function heroMove(dir){
  heroGo(heroIndex + dir);
}

function resetHeroTimer(){
  clearInterval(heroTimer);
  heroTimer = setInterval(() => heroMove(1), 6000);
}

function attachAfterRender(){
  window.onscroll = () => {
    const nav = document.getElementById('nav');
    if(nav) nav.classList.toggle('scrolled', window.scrollY > 50);

    // Dynamic active state toggle for Home vs Project in main view
    if(currentView === 'main'){
      const projSec = document.getElementById('projects');
      if(projSec){
        const rect = projSec.getBoundingClientRect();
        if(rect.top <= 180 && rect.bottom >= 150){
          updateNavActiveClasses('Project');
        } else if(rect.top > 180 && view.tab === 'All'){
          updateNavActiveClasses('Home');
        }
      }
    }
  };
  resetHeroTimer();
}

/* ------------------------------------------------------------
   INITIAL LOAD & PERIODIC AUTO-SYNC
   ------------------------------------------------------------ */
render();
loadData();
setInterval(loadData, 60000);
</script>
